# Antibiotic name list for suspicion-of-infection (Sepsis-3).
# Adapted from the MIT-LCP mimic-code `antibiotic` concept (generic + common
# brand names). Matched case-insensitively as substrings of prescriptions.drug.
# Prophylactic/topical-only agents are intentionally excluded.

# Routes to EXCLUDE (non-systemic) when counting an antibiotic as suspicion.
exclude_routes:
  - OU
  - OS
  - OD
  - AU
  - AS
  - AD
  - TP          # topical
  - "EYE"
  - "EAR"
  - "DWELL"
  - "OINTMENT"
  - "IRRIGATION"

